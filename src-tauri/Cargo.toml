[package]
name = "ai-partner"
version = "0.1.0"
description = "AI-Partner: See, Hear, Speak - Your AI Companion"
authors = ["AI-Partner Team"]
edition = "2021"

[lib]
name = "ai_partner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-positioner = "2"
tauri-plugin-log = { version = "2", features = ["tracing"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
anyhow = "1"
thiserror = "1"

image = { version = "0.25", features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
scrap = "0.5"
xcap = { version = "0.8", features = ["image"] }

cpal = { version = "0.15", features = ["jack"] }
hound = "3.5"
rubato = "0.15"

v4l = "0.14"

keyring = "4"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
rmp-serde = "1.1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
once_cell = "1"
parking_lot = "0.12"
